name: CI
on:
  push:
    branches: [main]
  pull_request:
  # a deploy by hand, from the Actions tab; it still runs every check first
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # pinned, so a new Ubuntu arrives as a commit rather than under the latest label
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Vite+, Node.js and pnpm come from the project, as they do locally: vite-plus in
      # the catalog, devEngines.runtime and devEngines.packageManager. It runs `vp install` too
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      # check:worker first: it generates worker-configuration.d.ts, which worker/tsconfig.json
      # names in `types`, and the type-aware lint in `check` reads that tsconfig; and it writes
      # .worker-types/, the Worker's declarations the app's hc client is typed by
      - run: vp run check:worker
      - run: vp run check
      # build before test: the Worker's integration tests start it with its assets directory
      - run: vp build
      # the browser tests (*.browser.test.ts) run in the Chromium Playwright pins
      - run: vp exec playwright install --with-deps chromium
      - run: vp test

  # main, once every check has passed, goes to chirashitabi.app; nothing else is deployed
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    # one deploy at a time, and a newer one waits for the one running instead of cutting it off
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      # the same as by hand (`vp run deploy`): a build without the mocks, then wrangler deploy.
      # Cloudflare's API now and then answers a deploy with a 504 or a malformed page; deploying
      # uploads the same build again, so wrangler deploy is tried up to three times, a while apart
      - run: VITE_MOCK=false vp build
      - run: |
          for attempt in 1 2 3; do
            if vp exec wrangler deploy; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::wrangler deploy failed (attempt $attempt of 3); trying again in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::wrangler deploy failed three times"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
