minimumReleaseAgeExclude:
  - vite@8.3.2
# wrangler's runtime (workerd) and bundler (esbuild) fetch a native binary on install
onlyBuiltDependencies:
  - esbuild
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
